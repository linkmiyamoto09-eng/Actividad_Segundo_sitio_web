<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="../img/logo.png" alt="Logo Biblioteca">
        </div>
    </header>

    <main style="max-width: 500px;">
        <section id="login-section">
            <h2>INICIO DE SESIÓN</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="correo">CORREO ELECTRÓNICO</label>
                    <input type="email" id="correo" required>
                </div>
                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">INICIO DE SESIÓN</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Biblioteca Internacional. Todos los derechos reservados.</p>
    </footer>
    <script src="../scripts/auth.js"></script>
</body>
</html>
